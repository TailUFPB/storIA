namespace: staging  # Define o namespace padrão para todos os recursos
resources:
- ../../base  # Herda tudo da base

# Patches para modificar recursos específicos
patchesStrategicMerge:
- patches/api-patch.yaml       # Ajustes na API
- patches/redis-patch.yaml     # Ajustes no Redis
- patches/monitoring-patch.yaml # Ajustes no Prometheus/Grafana (se necessário)

# Prefixo para evitar conflitos de nome
namePrefix: staging-  # Ex: staging-api-service-deployment