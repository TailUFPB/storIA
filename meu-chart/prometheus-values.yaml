server:
  persistentVolume:
    enabled: true
    size: 20Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: standard

serverFiles:
  prometheus.yml:
    global:
      scrape_interval: "15s"
    scrape_configs:
      - job_name: "api"
        static_configs:
          - targets: ["api-service:8000"]
      - job_name: "redis"
        static_configs:
          - targets: ["redis-exporter:9121"]
      - job_name: "loki"
        static_configs:
          - targets: ["loki:3100"]
      - job_name: "promtail"
        static_configs:
          - targets: ["promtail:9080"]
  alerting_rules.yml:
    groups:
      - name: "storIA-alerts"
        rules:
          - alert: "HighAPIErrorRate"
            expr: "rate(api_errors_total[5m]) > 0.1"
            for: "5m"
            labels:
              severity: "warning"
            annotations:
              summary: "API error rate is high"

alertmanager:
  enabled: true
