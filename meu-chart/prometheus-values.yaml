server:
  # Ativa o uso de volume persistente e utiliza o PVC já criado (prometheus-storage)
  persistentVolume:
    enabled: true
    existingClaim: prometheus-storage

serverFiles:
  prometheus.yml: |-
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'api'
        static_configs:
          - targets: ['api-service:8000']
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
      - job_name: 'loki'
        static_configs:
          - targets: ['loki:3100']
      - job_name: 'promtail'
        static_configs:
          - targets: ['promtail:9080']
