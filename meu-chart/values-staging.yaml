environment: staging
replicaCount: 1

image:
  repository: seu-registry/storia-api
  tag: staging
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: staging.storia.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

nodeSelector:
  environment: staging

tolerations:
  - key: "environment"
    operator: "Equal"
    value: "staging"
    effect: "NoSchedule"