environment: production
replicaCount: 3
image:
  repository: seu-registry/storia-api
  tag: v1.0.0
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10

# Complete com configurações específicas
autoscaling:
  api:
    targetCPU: 80
  inference:
    targetCPU: 90

resources:
  limits:
    cpu: "2"
    memory: 4Gi

ingress:
  tls:
    - secretName: storia-tls
      hosts:
        - storia.example.com