apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meu-chart.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: worker
    {{- include "meu-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        {{- include "meu-chart.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: false  # Temporariamente desabilitado para permitir initContainer
        readOnlyRootFilesystem: false
        allowPrivilegeEscalation: false

      initContainers:
      - name: wait-before-start
        image: {{ .Values.worker.initContainer.image | quote }}
        securityContext:
          runAsUser: 1000
        command: ["sleep", {{ .Values.worker.initContainer.delay | quote }} ]
      
      - name: fix-permissions
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /var/log/storia
            chown -R 1000:1000 /var/log/storia
            chmod 777 /var/log/storia
        securityContext:
          runAsUser: 0  # Executa como root para garantir permissões
        volumeMounts:
          - name: storia-logs
            mountPath: /var/log/storia

      containers:
      - name: worker
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          runAsUser: 1000  # Retorna para usuário não-root após inicialização
        command: {{ toYaml .Values.worker.command | nindent 8 }}
        env:
          - name: REDIS_HOST
            value: "storia-staging-redis-master.staging.svc.cluster.local"  # FQDN completo
          - name: REDIS_PORT
            value: "6379"
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}
        volumeMounts:
          - name: storia-logs
            mountPath: /var/log/storia

      volumes:
      - name: storia-logs
        persistentVolumeClaim:
          claimName: storia-logs
