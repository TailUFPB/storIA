{{- if .Values.autoscaling.inference.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "meu-chart.fullname" . }}-inference-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meu-chart.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "meu-chart.fullname" . }}-inference
  minReplicas: {{ .Values.autoscaling.inference.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.inference.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.autoscaling.inference.targetCPU }}
{{- end }}
