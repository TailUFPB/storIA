apiVersion: v1
kind: Service
metadata:
  name: inference-service
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  selector:
    app: inference
  ports:
    - protocol: TCP
      port: {{ .Values.inference.servicePort }}
      targetPort: {{ .Values.inference.port }}
  type: {{ .Values.inference.serviceType }}