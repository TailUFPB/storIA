{{- /* templates/api-service-hpa.yaml */ -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "storia.fullname" . }}-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "storia.fullname" . }}-api
  minReplicas: {{ .Values.apiService.hpa.minReplicas }}
  maxReplicas: {{ .Values.apiService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.apiService.hpa.averageUtilization }}
  selector:
    matchLabels:
      env: {{ .Values.apiService.environment | default "production" }}  # Selector de env
